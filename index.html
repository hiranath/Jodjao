<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Local Finder — Discover nearby businesses</title>
<style>
:root{--blue:#1a73e8;--blue2:#1a0dab;--text:#202124;--muted:#5f6368;--border:#dadce0;--green:#188038;--red:#d93025;--gold:#fbbc04;--bg:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,Arial,system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
.topbar{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f1f3f4;position:sticky;top:0;background:#fff;z-index:10}
.brand{font-size:20px;font-weight:650;letter-spacing:-.4px;color:var(--text);display:flex;gap:8px;align-items:center}.brand-dot{width:10px;height:10px;background:var(--blue);border-radius:50%}
.add-btn{border:1px solid var(--border);background:#fff;color:var(--blue);padding:9px 14px;border-radius:24px;font-size:14px;font-weight:600}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.search-head{text-align:center;padding:40px 0 22px}.search-title{font-size:32px;font-weight:500;letter-spacing:-1px;margin:0 0 18px}.search-title span{color:var(--blue)}
.search-wrap{max-width:620px;margin:auto;position:relative}.searchbox{width:100%;height:52px;border:1px solid #dfe1e5;border-radius:28px;padding:0 48px 0 18px;outline:none;box-shadow:0 1px 5px #00000012;font-size:16px}.searchbox:focus{box-shadow:0 1px 7px #00000020;border-color:#c5d8fa}.search-icon{position:absolute;right:17px;top:16px;color:var(--muted)}
.results-label{color:var(--muted);font-size:13px;padding:14px 2px;border-bottom:1px solid #eee}.result{display:flex;justify-content:space-between;gap:16px;padding:16px 4px;border-bottom:1px solid #eee;cursor:pointer}.result:hover{background:#fafafa}.result-main{min-width:0;flex:1}.result-title{color:var(--blue2);font-size:18px;font-weight:500;margin:0 0 5px}.meta{font-size:14px;color:var(--muted);line-height:1.5}.status{font-size:13px;font-weight:500;margin-top:4px}.open{color:var(--green)}.closed{color:var(--red)}.thumb{width:84px;height:84px;object-fit:cover;border-radius:12px;flex-shrink:0;background:#f1f3f4}
.profile{display:none}.profile.active{display:block}.search-view.hidden{display:none}
.profile-nav{display:flex;align-items:center;gap:10px;position:sticky;top:64px;background:#fff;padding:10px 0;z-index:5;border-bottom:1px solid #eee}.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:22px;color:var(--text)}.nav-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{position:relative;margin-top:12px}.cover{width:100%;height:205px;object-fit:cover;border-radius:16px;background:#e9eaee}.owner{position:absolute;bottom:-30px;left:16px;width:78px;height:78px;border:4px solid white;border-radius:50%;object-fit:cover;background:#ddd;box-shadow:0 2px 6px #0002}.owner-tag{position:absolute;bottom:-19px;left:104px;background:#fff;border:1px solid #eee;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;box-shadow:0 1px 4px #00000012}
.profile-head{padding:44px 2px 12px}.p-title{font-size:25px;line-height:1.2;margin:0 0 6px;font-weight:600}.verified{color:var(--blue);font-size:16px}.p-meta{font-size:14px;color:var(--muted);line-height:1.55}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:16px 0 22px;max-width:520px}
.action{text-decoration:none;color:#1a73e8;display:flex;align-items:center;flex-direction:column;justify-content:flex-start;gap:8px;font-size:13px;font-weight:600;min-width:0;padding:4px 2px;background:transparent;border:0}
.action-circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid #d5e2f8;background:#f4f8ff;color:#1a73e8;transition:background .15s,transform .15s}
.action:hover .action-circle{background:#e8f0fe;transform:translateY(-1px)}
.action-circle svg{width:23px;height:23px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.action.whatsapp{color:#128c50}
.action.whatsapp .action-circle{background:#25D366;color:#fff;border-color:#25D366;box-shadow:0 2px 6px rgba(37,211,102,.32)}
.action.whatsapp .action-circle svg{width:26px;height:26px;stroke:none;fill:#fff}
.action.whatsapp:hover .action-circle{background:#1ebe5d;transform:translateY(-1px)}
.action.directions{color:#1a73e8}
.action.share{color:#5f6368}
.action.share .action-circle{background:#f4f5f7;border-color:#e0e2e5;color:#5f6368}
.action-label{line-height:1.1;text-align:center}
.tabs{display:flex;border-bottom:1px solid var(--border);gap:4px;overflow:auto}.tab{padding:13px 16px;border:0;background:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab-panel{padding:18px 2px}.section-title{font-size:17px;font-weight:600;margin:0 0 12px}.info-row{display:flex;gap:12px;padding:11px 0;font-size:14px;line-height:1.5}.info-icon{width:22px;color:var(--muted);flex-shrink:0}.info-row a{color:var(--blue);text-decoration:none}
.service-list{display:grid;gap:10px}.service-card{border:1px solid #eee;border-radius:12px;padding:13px 14px;background:#fafafa}.service-name{font-weight:600;font-size:15px;color:var(--text);margin-bottom:4px}.service-desc{font-size:13px;color:var(--muted);line-height:1.45}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f4f5f7}.photo-card img.logo-fit{object-fit:contain;padding:10px;background:#fff;border:1px solid #eee}.photo-caption{font-size:13px;color:var(--muted);margin:6px 2px 10px}.empty{padding:40px 10px;text-align:center;color:var(--muted)}.footer-note{color:#9aa0a6;font-size:12px;text-align:center;margin-top:35px}
.modal-back{display:none;position:fixed;inset:0;background:#0006;z-index:30;padding:18px;align-items:center;justify-content:center}.modal-back.show{display:flex}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0003}.modal h2{margin:0 0 8px;font-size:20px}.modal p{font-size:14px;color:var(--muted);line-height:1.5}.form-field{display:block;margin:12px 0}.form-field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.form-field input,.form-field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px;outline:none}.form-field textarea{min-height:76px;resize:vertical}.form-buttons{display:flex;gap:10px;margin-top:18px}.form-buttons button{border-radius:22px;padding:10px 15px;border:1px solid var(--border);background:white}.form-buttons .send{background:var(--blue);color:white;border-color:var(--blue);flex:1}
@media(min-width:700px){.search-head{padding-top:55px}.result{padding:18px 10px}.profile-head{padding-top:50px}.cover{height:260px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span> Local Finder</div>
  <button class="add-btn" id="addBusinessBtn">＋ Add business</button>
</header>
<main>
<section id="searchView" class="search-view">
  <div class="search-head">
    <h1 class="search-title">Find local <span>businesses</span></h1>
    <div class="search-wrap">
      <input class="searchbox" id="searchInput" type="search" placeholder="Search shops, services, area…" aria-label="Search businesses">
      <span class="search-icon">⌕</span>
    </div>
  </div>
  <div class="results-label" id="resultsLabel">Listings · Search by business, category, area, or products</div>
  <div id="results"></div>
  <p class="footer-note">Local Finder directory</p>
</section>
<section id="profileView" class="profile">
  <div class="profile-nav"><button class="back" id="backBtn" aria-label="Back">←</button><div class="nav-name" id="navName"></div></div>
  <div id="profileContent"></div>
</section>
</main>
<div class="modal-back" id="addModal">
 <div class="modal">
  <h2>Add your business</h2>
  <p>Fill in your business details. Attach your shop photo and owner photo in the email before sending.</p>
  <form id="addForm">
   <div class="form-field"><label>Business Name *</label><input name="business" required></div>
   <div class="form-field"><label>Owner Name</label><input name="owner"></div>
   <div class="form-field"><label>Products / Services *</label><textarea name="products" required></textarea></div>
   <div class="form-field"><label>Full Address *</label><textarea name="address" required></textarea></div>
   <div class="form-field"><label>Business Timing</label><input name="timing" placeholder="e.g. 9:00 AM – 9:00 PM"></div>
   <div class="form-field"><label>Contact Number *</label><input name="phone" required inputmode="tel"></div>
   <div class="form-buttons"><button type="button" id="cancelAdd">Cancel</button><button type="submit" class="send">Send via Email</button></div>
  </form>
 </div>
</div>

const $=id=>document.getElementById(id);
const safe=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function filtered(q){
 q=q.toLowerCase().trim();
 return businesses.filter(b=>!q||[b.name,b.type,b.address,b.about,...(b.services||[]).map(s=>s.name+" "+s.desc),...(b.extraPhotos||[]).map(p=>p.caption)].join(" ").toLowerCase().includes(q));
}
function renderResults(){
 const q=$("searchInput").value;const list=filtered(q);$("resultsLabel").textContent=`${list.length} business listing${list.length===1?"":"s"}`;
 $("results").innerHTML=list.length?list.map(b=>`<article class="result" data-id="${safe(b.id)}"><div class="result-main"><h2 class="result-title">${safe(b.name)}</h2><div class="meta">${safe(b.type)} · ${safe(b.address)}</div><div class="status ${b.isOpen?"open":"closed"}">${b.isOpen?"Open":"Closed"} · ${safe(b.timing)}</div></div><img class="thumb" src="${safe(b.shopPhoto)}" alt="${safe(b.name)}" loading="lazy"></article>`).join(""):`<div class="empty">No businesses found. Try another name, category, area, or product.</div>`;
 document.querySelectorAll(".result").forEach(el=>el.addEventListener("click",()=>openProfile(el.dataset.id)));
}

 renderTab(b,"overview");
 document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");renderTab(b,t.dataset.tab)}));
 $("shareBtn").addEventListener("click",async()=>{try{if(navigator.share)await navigator.share({title:b.name,text:`View ${b.name} on Local Finder`,url:shareUrl});else{await navigator.clipboard.writeText(shareUrl);alert("Profile link copied");}}catch(e){if(e.name!=="AbortError"){try{await navigator.clipboard.writeText(shareUrl);alert("Profile link copied");}catch{prompt("Copy profile link:",shareUrl)}}}});
}
function renderTab(b,tab){
 const panel=$("tabPanel");
 if(tab==="overview"){panel.innerHTML=`<h3 class="section-title">About</h3><div class="info-row"><span class="info-icon">ℹ</span><div>${safe(b.about)}</div></div><h3 class="section-title" style="margin-top:20px">Business information</h3><div class="info-row"><span class="info-icon">⌖</span><div>${safe(b.address)}<br><a href="${safe(b.mapUrl)}" target="_blank" rel="noopener">View on map</a></div></div><div class="info-row"><span class="info-icon">◷</span><div>${safe(b.timing)}</div></div>${b.website?`<div class="info-row"><span class="info-icon">↗</span><div><a href="${safe(b.website)}" target="_blank" rel="noopener">${safe(b.website)}</a></div></div>`:""}`}
 if(tab==="services"){panel.innerHTML=b.services?.length?`<div class="service-list">${b.services.map(s=>`<div class="service-card"><div class="service-name">${safe(s.name)}</div><div class="service-desc">${safe(s.desc)}</div></div>`).join("")}</div>`:`<div class="empty">No products or services listed yet.</div>`}
 if(tab==="photos"){const allPhotos=[...(b.extraPhotos||[])];panel.innerHTML=`<div class="photos">${allPhotos.map(p=>`<div class="photo-card"><img class="${p.fit||""}" src="${safe(p.url)}" alt="${safe(p.caption)}" loading="lazy"><div class="photo-caption">${safe(p.caption)}</div></div>`).join("")}</div>`}
}
function showSearch(){ $("profileView").classList.remove("active");$("searchView").classList.remove("hidden");if(location.hash)history.pushState(null,"",location.pathname+location.search);renderResults()}
function routeHash(){const id=location.hash.startsWith("#profile-")?location.hash.slice(9):null;if(id)openProfile(id);else showSearch()}
$("searchInput").addEventListener("input",renderResults);$("backBtn").addEventListener("click",showSearch);window.addEventListener("popstate",routeHash);window.addEventListener("hashchange",routeHash);renderResults();routeHash();

const modal=$("addModal");$("addBusinessBtn").onclick=()=>modal.classList.add("show");$("cancelAdd").onclick=()=>modal.classList.remove("show");modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});
$("addForm").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target);const subject=`New Business Listing Request — ${f.get("business")}`;const body=`Business Listing Request — Local Finder

Business Name: ${f.get("business")}
Owner Name: ${f.get("owner")||"Not provided"}
Products/Services: ${f.get("products")}
Full Address: ${f.get("address")}
Business Timing: ${f.get("timing")||"Not provided"}
Contact Number: ${f.get("phone")}

Please attach Shop Photo and Owner Photo before sending.`;const mailUrl=`mailto:${ADMIN_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;location.href=mailUrl;modal.classList.remove("show")});
</script>
